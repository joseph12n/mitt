# nFPM package definition for mitt (rpm + deb), built user-space, no root.
name: mitt
version: 0.3.0
release: 1
arch: amd64
maintainer: mitt contributors
description: mitt bar POS PC hub
license: MIT
homepage: https://github.com/joseph12n/mitt
contents:
  - src: bin/mitt-linux
    dst: /usr/bin/mitt
    file_info:
      mode: 0755
  - src: packaging/mitt.service
    dst: /usr/lib/systemd/system/mitt.service
    file_info:
      mode: 0644
  - src: README.md
    dst: /usr/share/doc/mitt/README.md
  - src: LICENSE
    dst: /usr/share/licenses/mitt/LICENSE
  - src: packaging/mitt.desktop
    dst: /usr/share/applications/mitt.desktop
    file_info:
      mode: 0644
  - src: packaging/mitt.svg
    dst: /usr/share/icons/hicolor/scalable/apps/mitt.svg
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/postinstall.sh
overrides:
  deb:
    contents:
      - src: bin/mitt-linux
        dst: /usr/bin/mitt
        file_info:
          mode: 0755
      - src: packaging/mitt.service
        dst: /usr/lib/systemd/system/mitt.service
        file_info:
          mode: 0644
      - src: README.md
        dst: /usr/share/doc/mitt/README.md
      - src: LICENSE
        dst: /usr/share/doc/mitt/LICENSE
      - src: packaging/mitt.desktop
        dst: /usr/share/applications/mitt.desktop
        file_info:
          mode: 0644
      - src: packaging/mitt.svg
        dst: /usr/share/icons/hicolor/scalable/apps/mitt.svg
        file_info:
          mode: 0644
