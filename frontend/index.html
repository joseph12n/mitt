<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mitt · Panel del bar</title>
    <script>
      // Pre-paint theme: persist the Personalizar toggle, default to light
      // (the Figma master is light-first). Runs before CSS so dark users
      // never see a light flash. Brand vars paint later over either column.
      try {
        var mittTheme = localStorage.getItem('mitt_theme');
        if (mittTheme !== 'light' && mittTheme !== 'dark') {
          mittTheme = 'light';
        }
        if (mittTheme === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {
        // Private mode: light default still paints.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
