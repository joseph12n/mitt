<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mitt · Panel del bar</title>
<style>
:root{
  /* role: bg */ --bg:#121417;
  /* role: surface */ --surface:#1C1F24;
  /* role: surface-raised */ --surface-raised:#262B33;
  /* role: text */ --text:#F2EFE6;
  /* role: text-muted */ --text-muted:#9AA1AD;
  /* role: accent */ --accent:#E8A33D;
  /* role: success */ --success:#4CAF6D;
  /* role: warn */ --warn:#E0B13E;
  /* role: danger */ --danger:#E05C5C;
  /* role: on-accent */ --on-accent:#1A1206;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif;margin:0;padding:16px;max-width:960px;margin-inline:auto}
h1{font-size:32px;font-weight:700;margin:8px 0}
h2{font-size:20px;font-weight:600;margin:24px 0 8px}
.money{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}
.card{background:var(--surface);border-radius:12px;padding:12px;margin:8px 0}
.card.open{border-left:4px solid var(--accent);background:var(--surface-raised)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{border-radius:8px;border:1px solid var(--surface-raised);padding:8px 12px;min-height:32px;font:inherit;color:var(--text);background:var(--surface-raised)}
button{background:var(--accent);color:var(--on-accent);border:none;cursor:pointer;font-weight:600}
button.ghost{background:var(--surface-raised);color:var(--text);border:1px solid var(--text-muted)}
button.danger{background:var(--danger);color:var(--text)}
button:disabled{opacity:.5;cursor:not-allowed}
.pill{border-radius:4px;padding:4px 12px;font-weight:600;font-size:12px}
.pill.on{background:var(--success);color:var(--bg)}
.pill.off{background:var(--danger);color:var(--text)}
.badge{border-radius:4px;padding:2px 8px;font-size:12px;background:var(--success);color:var(--bg)}
.badge.out{background:var(--danger);color:var(--text)}
.muted{color:var(--text-muted);font-size:12px}
.total{font-size:32px;font-weight:700}
ul{list-style:none;padding:0;margin:8px 0}
li{padding:4px 0;border-bottom:1px solid var(--surface-raised)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--danger);color:var(--text);border-radius:8px;padding:12px 20px;display:none;max-width:90vw}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
label{font-size:12px;color:var(--text-muted)}
</style>
</head>
<body>
<header>
  <h1>mitt · Panel del bar</h1>
  <button id="refresh" class="ghost" type="button">REFRESCAR</button>
</header>

<section>
  <h2>Conexión</h2>
  <div class="card row">
    <span id="pill" class="pill off">SIN TOKEN</span>
    <input id="token" type="text" placeholder="Token o enlace mitt://pair?…" size="34" autocomplete="off">
    <button id="save" type="button">GUARDAR</button>
  </div>
  <p class="muted">El token se guarda en este navegador. También puede pegar el enlace de emparejamiento completo.</p>
</section>

<section>
  <h2>MESAS</h2>
  <div class="card row">
    <input id="table" type="text" placeholder="Mesa (ej. T1)" size="12">
    <button id="open" type="button">ABRIR MESA</button>
  </div>
  <div id="tabs" class="grid"><p class="muted">Sin mesas abiertas.</p></div>
</section>

<section>
  <h2>CATÁLOGO</h2>
  <div id="products"><p class="muted">Sin productos.</p></div>
  <div class="card row">
    <input id="pname" type="text" placeholder="Nombre" size="16">
    <input id="pprice" type="number" placeholder="Precio" min="0" step="0.01" size="8">
    <button id="padd" type="button">AGREGAR</button>
  </div>
</section>

<section>
  <h2>GASTOS</h2>
  <div id="expenses"><p class="muted">Sin gastos.</p></div>
  <div class="card row">
    <input id="edesc" type="text" placeholder="Descripción" size="16">
    <input id="eqty" type="number" placeholder="Cantidad" min="0" step="any" size="8">
    <input id="ecost" type="number" placeholder="Costo" min="0" step="0.01" size="8">
    <button id="eadd" type="button">AGREGAR</button>
  </div>
</section>

<div id="toast" role="alert"></div>

<script>
"use strict";
// Base URL: same origin that served this page, unless a pairing link set another.
var base = localStorage.getItem("mitt_base") || location.origin;
var token = localStorage.getItem("mitt_token") || "";
var catalog = [];

function $(id){ return document.getElementById(id); }
// Money: integer cents to "$ 12.50" (es-AR style, no float math on display).
function money(cents){ return "$ " + (cents / 100).toFixed(2); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var toastTimer = null;
function toast(msg){
  var t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.style.display = "none"; }, 4000);
}
// Friendly Spanish error, never raw JSON: map API envelope codes to staff text.
function fail(status, body){
  if (status === 401 || status === 403){ toast("Token inválido. Revise la conexión."); return; }
  if (status === 404){ toast("No encontrado. Pulse REFRESCAR."); return; }
  var msg = "";
  try { var j = JSON.parse(body || ""); if (j && j.error && j.error.message) msg = j.error.message; } catch (e) {}
  if (status === 422){ toast(msg ? "Dato inválido: " + msg : "Dato inválido. Revise el formulario."); return; }
  toast("Ocurrió un error (código " + status + "). Intente de nuevo.");
}
// Fetch wrapper: every API call carries the pairing token.
async function api(method, path, data){
  var opt = { method: method, headers: { "Authorization": "Bearer " + token } };
  if (data !== undefined){ opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(data); }
  var res = await fetch(base + path, opt);
  var text = await res.text();
  if (!res.ok){ fail(res.status, text); return null; }
  try { return JSON.parse(text); } catch (e) { fail(res.status, ""); return null; }
}

function paintPill(){
  var p = $("pill");
  if (token){ p.textContent = "CONECTADO"; p.className = "pill on"; }
  else { p.textContent = "SIN TOKEN"; p.className = "pill off"; }
}

// Accept a pasted "mitt://pair?url=..&token=.." link: extract token and base URL.
function readPairing(raw){
  raw = (raw || "").trim();
  if (raw.indexOf("mitt://pair") !== 0) return { token: raw, base: null };
  var q = raw.slice(raw.indexOf("?") + 1);
  var out = { token: "", base: null };
  q.split("&").forEach(function(part){
    var kv = part.split("=");
    var k = decodeURIComponent(kv[0] || ""), v = decodeURIComponent(kv[1] || "");
    if (k === "token") out.token = v;
    if (k === "url") out.base = v.replace(/\/$/, "");
  });
  return out;
}

function paintTabs(data){
  var box = $("tabs");
  var tabs = (data && data.tabs) || [];
  if (!tabs.length){ box.innerHTML = "<p class='muted'>Sin mesas abiertas.</p>"; return; }
  box.innerHTML = "";
  tabs.forEach(function(t){
    var card = document.createElement("div");
    card.className = "card open";
    var lines = (t.items || []).map(function(it){
      return "<li><span class='money'>" + it.qty + " × " + esc(it.name) + "</span> · <span class='money'>" + money(it.line_total_cents) + "</span></li>";
    }).join("") || "<li class='muted'>Sin consumos.</li>";
    var opts = catalog.map(function(p){
      return "<option value='" + esc(p.id) + "'" + (p.available ? "" : " disabled") + ">" + esc(p.name) + " · " + money(p.price_cents) + "</option>";
    }).join("");
    card.innerHTML =
      "<strong>Mesa " + esc(t.table_id) + "</strong> <span class='muted'>Ocupada · <span class='money'>" + money(t.total_cents) + "</span></span>" +
      "<ul>" + lines + "</ul>" +
      "<div class='total money'>" + money(t.total_cents) + "</div>" +
      "<div class='row'><select data-addsel>" + opts + "</select>" +
      "<input data-addqty type='number' value='1' min='1' step='1' style='width:64px'>" +
      "<button type='button' data-add>AGREGAR</button>" +
      "<button type='button' class='danger' data-close>CERRAR</button></div>";
    card.querySelector("[data-add]").onclick = async function(){
      var pid = card.querySelector("[data-addsel]").value;
      var qty = parseInt(card.querySelector("[data-addqty]").value, 10);
      if (!pid || !(qty > 0)){ toast("Elija un producto y una cantidad válida."); return; }
      if (await api("POST", "/api/tabs/" + encodeURIComponent(t.id) + "/items", { product_id: pid, qty: qty })) refresh();
    };
    card.querySelector("[data-close]").onclick = async function(){
      if (!confirm("Cerrar mesa " + t.table_id + " por " + money(t.total_cents) + " (" + money(t.total_cents) + ")?")) return;
      var sale = await api("POST", "/api/tabs/" + encodeURIComponent(t.id) + "/close");
      if (sale){ toast("Mesa " + t.table_id + " cobrada: " + money(sale.total_cents) + "."); refresh(); }
    };
    box.appendChild(card);
  });
}

function paintProducts(data){
  catalog = (data && data.products) || [];
  var box = $("products");
  if (!catalog.length){ box.innerHTML = "<p class='muted'>Sin productos.</p>"; return; }
  box.innerHTML = "";
  catalog.forEach(function(p){
    var row = document.createElement("div");
    row.className = "card row";
    row.innerHTML = "<strong>" + esc(p.name) + "</strong> <span class='money'>" + money(p.price_cents) + "</span> " +
      (p.available ? "<span class='badge'>DISPONIBLE</span>" : "<span class='badge out'>SIN STOCK</span>");
    var btn = document.createElement("button");
    btn.type = "button"; btn.className = "ghost";
    btn.textContent = p.available ? "MARCAR SIN STOCK" : "MARCAR DISPONIBLE";
    btn.onclick = async function(){
      if (await api("PATCH", "/api/products/" + encodeURIComponent(p.id), { available: !p.available })) refresh();
    };
    row.appendChild(btn);
    box.appendChild(row);
  });
}

function paintExpenses(data){
  var box = $("expenses");
  var rows = (data && data.expenses) || [];
  if (!rows.length){ box.innerHTML = "<p class='muted'>Sin gastos.</p>"; return; }
  box.innerHTML = "<div class='card'><ul>" + rows.map(function(e){
    return "<li>" + esc(e.description) + " · " + esc(e.qty) + " u · <span class='money'>" + money(e.cost_cents) + "</span></li>";
  }).join("") + "</ul></div>";
}

async function refresh(){
  if (!token){ paintPill(); return; }
  paintPill();
  var tabs = await api("GET", "/api/tabs/open");
  var prods = await api("GET", "/api/products");
  var exps = await api("GET", "/api/expenses");
  if (prods) paintProducts(prods);
  if (tabs) paintTabs(tabs);
  if (exps) paintExpenses(exps);
}

$("save").onclick = function(){
  var parsed = readPairing($("token").value);
  token = (parsed.token || "").trim();
  if (parsed.base) base = parsed.base;
  localStorage.setItem("mitt_token", token);
  localStorage.setItem("mitt_base", base);
  $("token").value = token ? token : $("token").value;
  paintPill();
  if (token) refresh(); else toast("Guarde un token para conectar.");
};
$("refresh").onclick = refresh;
$("open").onclick = async function(){
  var label = $("table").value.trim();
  if (!label){ toast("Escriba el nombre de la mesa."); return; }
  var tab = await api("POST", "/api/tabs", { table_id: label });
  if (tab){ $("table").value = ""; refresh(); }
};
$("padd").onclick = async function(){
  var name = $("pname").value.trim();
  var cents = Math.round(parseFloat($("pprice").value) * 100);
  if (!name || !(cents >= 0)){ toast("Escriba nombre y precio válido."); return; }
  if (await api("POST", "/api/products", { name: name, price_cents: cents })){
    $("pname").value = ""; $("pprice").value = ""; refresh();
  }
};
$("eadd").onclick = async function(){
  var desc = $("edesc").value.trim();
  var qty = parseFloat($("eqty").value);
  var cents = Math.round(parseFloat($("ecost").value) * 100);
  if (!desc || !(qty > 0) || !(cents >= 0)){ toast("Complete descripción, cantidad y costo."); return; }
  if (await api("POST", "/api/expenses", { description: desc, qty: qty, cost_cents: cents })){
    $("edesc").value = ""; $("eqty").value = ""; $("ecost").value = ""; refresh();
  }
};

$("token").value = token;
paintPill();
if (token) refresh();
</script>
</body>
</html>
